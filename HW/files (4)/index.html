<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SILKWAVE Web/Admin API — Documentation</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./vendor/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./vendor/favicon-16x16.png">
  <link rel="stylesheet" href="./vendor/swagger-ui.css">
  <style>
    html, body { margin: 0; padding: 0; background: #fafafa; }
    #topbar-replacement {
      background: #1b1b1b;
      color: #eee;
      padding: 10px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #topbar-replacement strong { color: #fff; }
    #topbar-replacement span { color: #999; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div id="topbar-replacement">
    <div><strong>SILKWAVE Web/Admin API</strong> &mdash; hand-authored spec, not auto-generated</div>
    <span>served fully offline — no external network calls</span>
  </div>
  <div id="swagger-ui"></div>

  <!-- All assets below are vendored locally in ./vendor — no CDN, no external network access required -->
  <script src="./vendor/swagger-ui-bundle.js"></script>
  <script src="./vendor/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        // Cache-buster on the query string so browser caching doesn't serve a stale spec
        // after you edit the YAML. Bump manually or leave as Date.now() during active editing.
        url: "./silkwave-web-api-openapi.yaml?v=" + Date.now(),
        dom_id: "#swagger-ui",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        deepLinking: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 2,
        tryItOutEnabled: false
      });
    };
  </script>
</body>
</html>
